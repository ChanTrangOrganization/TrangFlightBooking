name: Update contact section design

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  update-contact:
    if: "!contains(github.event.head_commit.message, 'Update contact section design')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Update contact section
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')

          old_zalo = '''<a class="contact-card" href="https://zalo.me/0357597346" target="_blank" rel="noopener noreferrer"><span class="contact-card__icon"><svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M21 11.5a8.5 8.5 0 0 1-8.5 8.5 8.4 8.4 0 0 1-4-1L3 20l1.1-3.8A8.5 8.5 0 1 1 21 11.5z" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg></span><h3>Zalo</h3><p>0357 597 346</p></a>'''
          new_zalo = '''<a class="contact-card" href="https://zalo.me/0357597346" target="_blank" rel="noopener noreferrer"><span class="contact-card__icon contact-card__icon--zalo" aria-hidden="true"><svg viewBox="0 0 48 48" xmlns="http://www.w3.org/2000/svg"><circle cx="24" cy="24" r="22" fill="currentColor" opacity="0.12"/><path d="M24 9C15.2 9 8 15.3 8 23c0 4.6 2.3 8.7 6.1 11.3-.2 1.1-.8 3.6-1 4.2-.2.6.2.7.7.4.7-.4 3.7-2.2 5.1-3.1 1.6.5 3.3.7 5.1.7 8.8 0 16-6.3 16-14S32.8 9 24 9Z" fill="currentColor"/><text x="24" y="28.8" text-anchor="middle" font-family="Arial,sans-serif" font-size="10" font-weight="700" fill="#fff">Zalo</text></svg></span><h3>Zalo</h3><p>0357 597 346</p></a>'''
          if old_zalo in s:
              s = s.replace(old_zalo, new_zalo)

          s = s.replace('<h3>Khu vực phục vụ</h3><p>Toàn quốc</p>', '<h3>Khu vực phục vụ</h3><p>Toàn cầu · Bất kỳ nơi đâu</p>')
          p.write_text(s, encoding='utf-8')

          css = Path('css/style.css')
          c = css.read_text(encoding='utf-8')
          marker = '/* Contact cards: centered typography and distinctive Zalo icon */'
          rules = '''\n\n/* Contact cards: centered typography and distinctive Zalo icon */\n.contact-card {\n  display: flex;\n  flex-direction: column;\n  align-items: center;\n  justify-content: center;\n  text-align: center;\n}\n\n.contact-card__icon--zalo {\n  color: #0068ff;\n}\n\n.contact-card__icon--zalo svg {\n  width: 28px;\n  height: 28px;\n}\n\n.contact-card h3,\n.contact-card p {\n  text-align: center;\n}\n'''
          if marker not in c:
              c += rules
          css.write_text(c, encoding='utf-8')
          PY

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html css/style.css
          git diff --cached --quiet || git commit -m "Update contact section design"
          git push