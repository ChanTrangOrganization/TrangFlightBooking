<svg viewBox="0 0 600 640" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      .blob-main { fill: #dceefb; }
      .blob-accent { fill: #cfe6fb; }
      .ground { fill: #bfe0fa; opacity:.6; }
      .plane { fill: #8fc2f2; }
      .phone-body { fill: #ffffff; stroke:#1a56c4; stroke-width:6; }
      .phone-bar { fill:#eaf3fd; }
      .pin-bg { fill:#f5a623; }
      .pin { fill:#ffffff; }
      .line { fill:#bcd6f2; }
      .line--light { fill:#d7e8fa; }
      .price { fill:#dceefb; }
      .price__text { fill:#1a56c4; font-family: Arial, sans-serif; font-size:14px; font-weight:700; }
      .card-bg { fill:#cfe6fb; }
      .badge { fill:#f5a623; }
      .badge-icon { fill:#ffffff; }
      .passport { fill:#153a7a; }
      .passport-globe { fill:none; stroke:#f5a623; stroke-width:3; }
      .passport-label { fill:#f5a623; font-family: Arial, sans-serif; font-size:9px; font-weight:800; letter-spacing:.3px;}
      .ticket-bg { fill:#ffffff; stroke:#bcd6f2; stroke-width:2; }
      .ticket-badge { fill:#f5a623; }
      .ticket-divider { stroke:#bcd6f2; stroke-width:2; }
      .luggage-body { fill:#1a56c4; }
      .luggage-body--accent { fill:#f5a623; }
      .luggage-handle { fill:#153a7a; }
      .luggage-wheel { fill:#153a7a; }
      .skin { fill:#f7c9a3; }
      .hair { fill:#12224a; }
      .dress { fill:#1a56c4; }
      .laptop { fill:#7d95b8; }
      .laptop-screen { fill:#e7edf6; }
      .shoe { fill:#12224a; }
      .shirt-orange { fill:#f5a623; }
      .pants-navy { fill:#12224a; }
      .hat { fill:#f0b73f; }
      .camera { fill:#12224a; }
      .top-pink { fill:#d63b8e; }
      .skirt-navy { fill:#12224a; }
      .phone-small { fill:#12224a; }
    </style>
  </defs>

  <!-- ============ BACKGROUND ============ -->
  <ellipse class="blob-main" cx="300" cy="320" rx="260" ry="290"/>
  <path class="blob-accent" d="M540,180 Q610,280 555,380 Q505,470 400,520 Q470,440 470,350 Q470,250 420,180 Q480,140 540,180 Z"/>
  <ellipse class="ground" cx="300" cy="608" rx="220" ry="16"/>

  <!-- ============ PLANE ============ -->
  <g class="plane" transform="translate(70,150) rotate(-18)">
    <path d="M0,16 L58,11 L86,0 L94,3 L78,15 L118,13 L128,17 L118,21 L78,19 L94,31 L86,34 L58,23 L0,16 Z"/>
  </g>

  <!-- ============ LEFT DOCUMENT STACK (ticket card + passport) ============ -->
  <g transform="translate(50,255)">
    <rect class="card-bg" x="0" y="0" width="115" height="305" rx="16"/>
    <circle class="badge" cx="57" cy="60" r="42"/>
    <path class="badge-icon" transform="translate(30,38)" d="M0,20 L34,17 L50,7 L55,9 L45,18 L66,17 L72,20 L66,23 L45,22 L55,31 L50,33 L34,23 L0,20 Z"/>
    <rect class="passport" x="16" y="150" width="83" height="145" rx="10"/>
    <circle class="passport-globe" cx="57" cy="205" r="24"/>
    <ellipse class="passport-globe" cx="57" cy="205" rx="10" ry="24"/>
    <line class="passport-globe" x1="34" y1="197" x2="80" y2="197"/>
    <line class="passport-globe" x1="34" y1="213" x2="80" y2="213"/>
    <text class="passport-label" x="57" y="255" text-anchor="middle">PASSPORT</text>
    <rect x="37" y="266" width="40" height="4" rx="2" fill="#f5a623"/>
  </g>

  <!-- ============ PHONE MOCKUP ============ -->
  <g>
    <rect class="phone-body" x="255" y="115" width="245" height="450" rx="30"/>
    <rect class="phone-bar" x="275" y="140" width="205" height="14" rx="7"/>

    <!-- row 1 -->
    <g transform="translate(275,178)">
      <circle class="pin-bg" cx="20" cy="20" r="18"/>
      <path class="pin" d="M20,10 a8,8 0 1,1 -0.01,0 Z M20,20 a3,3 0 1,0 0.01,0 Z" fill="#f5a623"/>
      <circle cx="20" cy="17" r="6" fill="#ffffff"/>
      <path d="M20,17 l0,10 l-6,-8 z M20,17 l0,10 l6,-8 z" fill="#f5a623"/>
      <rect class="line" x="52" y="10" width="95" height="7" rx="3.5"/>
      <rect class="line--light" x="52" y="24" width="65" height="7" rx="3.5"/>
      <rect class="price" x="178" y="5" width="42" height="30" rx="9"/>
      <text class="price__text" x="199" y="26" text-anchor="middle">$</text>
    </g>
    <!-- row 2 -->
    <g transform="translate(275,248)">
      <circle class="pin-bg" cx="20" cy="20" r="18"/>
      <circle cx="20" cy="17" r="6" fill="#ffffff"/>
      <path d="M20,17 l0,10 l-6,-8 z M20,17 l0,10 l6,-8 z" fill="#f5a623"/>
      <rect class="line" x="52" y="10" width="95" height="7" rx="3.5"/>
      <rect class="line--light" x="52" y="24" width="65" height="7" rx="3.5"/>
      <rect class="price" x="178" y="5" width="42" height="30" rx="9"/>
      <text class="price__text" x="199" y="26" text-anchor="middle">$</text>
    </g>
    <!-- row 3 -->
    <g transform="translate(275,318)">
      <circle class="pin-bg" cx="20" cy="20" r="18"/>
      <circle cx="20" cy="17" r="6" fill="#ffffff"/>
      <path d="M20,17 l0,10 l-6,-8 z M20,17 l0,10 l6,-8 z" fill="#f5a623"/>
      <rect class="line" x="52" y="10" width="95" height="7" rx="3.5"/>
      <rect class="line--light" x="52" y="24" width="65" height="7" rx="3.5"/>
      <rect class="price" x="178" y="5" width="42" height="30" rx="9"/>
      <text class="price__text" x="199" y="26" text-anchor="middle">$</text>
    </g>
    <!-- row 4 -->
    <g transform="translate(275,388)">
      <circle class="pin-bg" cx="20" cy="20" r="18"/>
      <circle cx="20" cy="17" r="6" fill="#ffffff"/>
      <path d="M20,17 l0,10 l-6,-8 z M20,17 l0,10 l6,-8 z" fill="#f5a623"/>
      <rect class="line" x="52" y="10" width="95" height="7" rx="3.5"/>
      <rect class="line--light" x="52" y="24" width="65" height="7" rx="3.5"/>
      <rect class="price" x="178" y="5" width="42" height="30" rx="9"/>
      <text class="price__text" x="199" y="26" text-anchor="middle">$</text>
    </g>
  </g>

  <!-- ============ RIGHT BOARDING PASS CARD ============ -->
  <g transform="translate(455,395)">
    <rect class="ticket-bg" x="0" y="0" width="150" height="120" rx="14"/>
    <circle class="ticket-badge" cx="32" cy="32" r="22"/>
    <path fill="#ffffff" transform="translate(19,25)" d="M0,10 L17,8 L25,3 L28,4 L23,9 L33,8 L36,10 L33,12 L23,11 L28,16 L25,17 L17,12 L0,10 Z"/>
    <rect class="line" x="66" y="18" width="65" height="7" rx="3.5"/>
    <rect class="line--light" x="66" y="32" width="45" height="7" rx="3.5"/>
    <line class="ticket-divider" x1="0" y1="62" x2="150" y2="62" stroke-dasharray="5 5"/>
    <rect class="line--light" x="16" y="78" width="118" height="6" rx="3"/>
    <rect class="line--light" x="16" y="92" width="88" height="6" rx="3"/>
    <rect class="line--light" x="16" y="106" width="60" height="6" rx="3"/>
  </g>

  <!-- ============ WOMAN WITH LAPTOP (sitting on phone) ============ -->
  <g transform="translate(325,45)">
    <path class="hair" d="M10,55 Q0,10 45,5 Q88,2 88,45 Q88,55 82,62 L14,60 Z"/>
    <circle class="skin" cx="47" cy="42" r="27"/>
    <path class="hair" d="M20,28 Q28,5 55,10 Q75,14 72,30 Q55,18 35,26 Q26,30 20,28 Z"/>
    <path class="dress" d="M12,66 Q47,48 82,66 L92,150 Q47,168 2,150 Z"/>
    <rect class="leg" x="14" y="145" width="18" height="34" rx="7" fill="#f7c9a3"/>
    <rect class="leg" x="62" y="145" width="18" height="34" rx="7" fill="#f7c9a3"/>
    <ellipse class="shoe" cx="23" cy="181" rx="15" ry="7"/>
    <ellipse class="shoe" cx="71" cy="181" rx="15" ry="7"/>
    <g transform="translate(18,95)">
      <rect class="laptop-screen" x="6" y="0" width="56" height="34" rx="3"/>
      <rect class="laptop" x="0" y="34" width="68" height="8" rx="3"/>
    </g>
  </g>

  <!-- ============ MAN WITH HAT + SUITCASE ============ -->
  <g transform="translate(165,410)">
    <ellipse class="hat" cx="35" cy="14" rx="30" ry="8"/>
    <path class="hat" d="M14,14 Q14,-14 35,-14 Q56,-14 56,14 Z"/>
    <circle class="skin" cx="35" cy="30" r="22"/>
    <path class="shirt-orange" d="M8,50 Q35,34 62,50 L70,130 Q35,146 0,130 Z"/>
    <path fill="none" stroke="#12224a" stroke-width="3" d="M22,52 L35,80 L48,52"/>
    <circle class="camera" cx="35" cy="82" r="8"/>
    <rect class="pants-navy" x="6" y="128" width="24" height="46" rx="6"/>
    <rect class="pants-navy" x="40" y="128" width="24" height="46" rx="6"/>
    <ellipse class="shoe" cx="18" cy="176" rx="15" ry="7"/>
    <ellipse class="shoe" cx="52" cy="176" rx="15" ry="7"/>
    <!-- suitcase -->
    <g transform="translate(78,90)">
      <rect class="luggage-handle" x="18" y="0" width="26" height="20" rx="8"/>
      <rect class="luggage-body" x="0" y="18" width="62" height="95" rx="10"/>
      <rect class="luggage-body--accent" x="10" y="45" width="42" height="8" rx="4"/>
      <circle class="luggage-wheel" cx="14" cy="118" r="7"/>
      <circle class="luggage-wheel" cx="48" cy="118" r="7"/>
    </g>
  </g>

  <!-- ============ WOMAN WITH PHONE + SUITCASE ============ -->
  <g transform="translate(400,415)">
    <path class="hair" d="M10,44 Q0,-6 35,-8 Q68,-10 68,30 Q67,44 58,50 L52,36 Q56,16 35,12 Q15,10 14,40 Z"/>
    <circle class="skin" cx="36" cy="28" r="21"/>
    <path class="top-pink" d="M10,48 Q36,32 62,48 L68,120 Q36,134 4,120 Z"/>
    <rect class="skirt-navy" x="4" y="112" width="64" height="34" rx="8"/>
    <rect class="leg" x="14" y="140" width="17" height="32" rx="6" fill="#f7c9a3"/>
    <rect class="leg" x="41" y="140" width="17" height="32" rx="6" fill="#f7c9a3"/>
    <ellipse class="shoe" cx="22" cy="174" rx="14" ry="6"/>
    <ellipse class="shoe" cx="50" cy="174" rx="14" ry="6"/>
    <rect class="phone-small" x="60" y="60" width="14" height="24" rx="3"/>
    <!-- suitcase -->
    <g transform="translate(78,85)">
      <rect class="luggage-handle" x="14" y="0" width="22" height="18" rx="7"/>
      <rect class="luggage-body" x="0" y="16" width="52" height="88" rx="9"/>
      <rect class="luggage-body--accent" x="0" y="16" width="14" height="88" rx="6"/>
      <circle class="luggage-wheel" cx="12" cy="108" r="6"/>
      <circle class="luggage-wheel" cx="40" cy="108" r="6"/>
    </g>
  </g>
</svg>
